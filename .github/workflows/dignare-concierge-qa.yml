name: Dignare Concierge - qualidade da branch

on:
  push:
    branches: ['feat/dignare-concierge-mvp-20261020', 'feat/dignare-navigation-persistence-v05']
    paths:
      - 'dignidade-360-app/**'
      - '.github/workflows/dignare-concierge-qa.yml'
  pull_request:
    paths:
      - 'dignidade-360-app/**'
      - '.github/workflows/dignare-concierge-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Typecheck, lint and Next build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: dignidade-360-app
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout reviewed code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dignidade-360-app/package-lock.json
      - name: Install exact locked dependencies
        run: npm ci
      - name: Validate Prisma schema without connecting to a database
        env:
          DATABASE_URL: postgresql://validation:validation@localhost:5432/never_connect
        run: npx prisma validate
      - name: Build without mutating database or seeding
        run: npm run build
  security:
    name: Runtime dependency audit
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: dignidade-360-app
    steps:
      - name: Checkout reviewed code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dignidade-360-app/package-lock.json
      - name: Install dependencies without executing package scripts
        run: npm ci --ignore-scripts
      - name: Block unreviewed critical vulnerabilities in runtime dependencies
        run: npm audit --omit=dev --audit-level=critical
