name: Dignare - atualizar lockfile somente nesta branch

on:
  push:
    branches: ['feat/dignare-concierge-mvp-20261020']
    paths:
      - 'dignidade-360-app/package.json'
      - '.github/workflows/dignare-lock-refresh.yml'

permissions:
  contents: write

jobs:
  lockfile:
    if: github.ref == 'refs/heads/feat/dignare-concierge-mvp-20261020'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/dignare-concierge-mvp-20261020
          persist-credentials: true
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Generate lockfile without package install scripts or database access
        working-directory: dignidade-360-app
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile only to the feature branch
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = 'refs/heads/feat/dignare-concierge-mvp-20261020'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- dignidade-360-app/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(deps): regenerate lockfile for reviewed security patch'
            git push origin HEAD:refs/heads/feat/dignare-concierge-mvp-20261020
          else
            echo 'Lockfile unchanged.'
          fi
